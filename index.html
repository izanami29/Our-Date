<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Will You Go on a Date?</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        h1 {
            color: #ff4d6d;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #yes {
            background-color: #ff4d6d;
            color: white;
        }

        #no {
            background-color: #ddd;
            color: #333;
            position: relative;
        }

        #message {
            display: none;
            color: #ff4d6d;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>💖 Will You Go on a Date With Me?</h1>

        <p>I have a question for you...</p>

        <button id="yes" onclick="sayYes()">Yes ❤️</button>

        <button id="no" onmouseover="moveNo()">No 😢</button>

        <p id="message">
            YAY! 🥰❤️<br>
            It's a date!
        </p>

    </div>

    <script>
        function sayYes() {
            document.getElementById("message").style.display = "block";
        }

        function moveNo() {
            const button = document.getElementById("no");

            const x = Math.random() * 200 - 100;
            const y = Math.random() * 200 - 100;

            button.style.transform =
                `translate(${x}px, ${y}px)`;
        }
    </script>

</body>

</html>
